  expected_manual_verdict: PASS
  uses_spec2testbench_verdict: false
- case_id: cv_003_p11_c_huge
  parent_circuit_id: p11_highpass
  manual_deck: decks/cv_003_p11_c_huge_manual.ckt
  independent_reference:
    method: analytical_first_order_rc
    R_ohm: 10000.0
    C_farad: 1.0
