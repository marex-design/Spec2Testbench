label_definitions:
  GROUND_TRUTH_COMPLIANT: Independent calculations or measurements indicate targeted
    specifications should pass.
  GROUND_TRUTH_NONCOMPLIANT: A controlled mutation should fail at least one targeted
    specification.
  GROUND_TRUTH_NON_SIMULABLE: A controlled mutation is expected to create a simulator/convergence
    error.
  GROUND_TRUTH_UNCERTAIN: Evidence is insufficient; excluded from principal metrics.
framework_result_not_used_for_labels: true
cases:
- case_id: p10_lowpass_nominal_gt
  parent_circuit_id: p10_lowpass
  variant_type: nominal
  ground_truth_label: GROUND_TRUTH_COMPLIANT
  circuit_family: low_pass_filter
  specification_file: examples/benchmark_specs/p10_lowpass.yaml
  netlist_file: benchmark/analogcoder_pro/p10_lowpass.cir
  critical_components: R1/C1 define the RC pole.
  targeted_metric:
    name: cutoff_frequency_hz
    operator: within
    lower_bound: 1.0
    upper_bound: 1000000000.0
    unit: Hz
  independent_reference:
    method: analytical
    equation: fc = 1/(2*pi*R1*C1), R1=10k, C1=10n
    expected_value: 1591.55
    unit: Hz
    tolerance_percent: 20
  justification: p10_lowpass is a nominal benchmark circuit. The label is assigned
    from analytical evidence (fc = 1/(2*pi*R1*C1), R1=10k, C1=10n), before executing
    Spec2Testbench.
  reviewer:
    status: manually_verified
    notes: Original benchmark artifact is not modified; ambiguous cases are excluded
      from metrics.
