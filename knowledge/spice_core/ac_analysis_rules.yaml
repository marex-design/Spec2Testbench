- rule_id: AC_TRANSFER_GAIN_USES_COMPLEX_RATIO
  schema_version: '1.0'
  knowledge_version: knowledge_book_v1
  category: ac_analysis
  title: Transfer gain uses the complex Vout over Vin ratio
  description: Voltage transfer gain is derived from the complex output-to-input ratio, not from absolute output dBV.
  applies_to:
    analyses:
    - AC
    metrics:
    - dc_gain
    - dc_gain_db
    circuit_families:
    - amplifier
    - filter
    - opamp
    backends:
    - NGSPICE_WRDATA
  requires:
    node_roles:
    - SIGNAL_INPUT
    - OUTPUT
    evidence:
    - VIN_COMPLEX_VECTOR
    - VOUT_COMPLEX_VECTOR
  forbids:
