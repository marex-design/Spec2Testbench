kind: error_taxonomy
errors:
- error_id: SIMULATION_FAILURE
  description: ngspice execution failed before producing usable evidence.
- error_id: MISSING_VECTOR
  description: A required WRDATA vector was not produced.
- error_id: SEMANTIC_GUARD_REJECTION
  description: A metric was rejected by a scientific guard rather than by parser failure.
- error_id: PHYSICAL_PREREQUISITE_ABSENT
  description: The DUT does not produce the physical behavior required for the metric.
