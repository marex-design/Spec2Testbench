- rule_id: ZERO_AC_INPUT_IS_NOT_EVALUATED
  schema_version: '1.0'
  knowledge_version: knowledge_book_v1
  category: numeric
  title: Zero AC input is not a valid transfer-gain denominator
  description: Transfer-gain extraction must never substitute a numeric floor when the AC input vector is zero.
  applies_to:
    analyses:
    - AC
    metrics:
    - dc_gain
    - dc_gain_db
    - transfer_magnitude_linear
    - transfer_phase_deg
    circuit_families:
    - amplifier
    - filter
    - opamp
    backends:
    - NGSPICE_WRDATA
  requires:
    evidence:
    - VIN_COMPLEX_VECTOR
  forbids:
  - ZERO_INPUT_DIVISION
  - SYNTHETIC_NUMERIC_FLOOR_AS_METRIC
  source:
