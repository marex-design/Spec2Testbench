- rule_id: POSITIVE_AC_STOP_FREQUENCY
  schema_version: '1.0'
  knowledge_version: knowledge_book_v1
  category: numeric
  title: AC stop frequency must exceed start frequency
  description: AC sweep parameters are rejected when the stop frequency does not exceed the start frequency.
  applies_to:
    analyses:
    - AC
    metrics:
    - dc_gain_db
    - cutoff_frequency_hz
    - bandwidth
    circuit_families:
    - amplifier
    - filter
    - opamp
    backends:
    - NGSPICE_WRDATA
  requires:
    evidence:
    - AC_SWEEP_PARAMETERS
  forbids:
  - NEGATIVE_FREQUENCIES
  - NON_INCREASING_AC_RANGE
  source:
