- rule_id: INPUT_NODE_ROLE_REQUIRED
  schema_version: '1.0'
  knowledge_version: knowledge_book_v1
  category: nodes
  title: Input-role nodes must be explicit when a metric depends on Vin
  description: Transfer, delay, and hysteresis metrics require an explicit input-role node in the plan and recipes.
  applies_to:
    analyses:
    - AC
    - TRAN
    metrics:
    - dc_gain_db
    - propagation_delay
    - hysteresis_width
    circuit_families:
    - amplifier
    - comparator
    - schmitt_trigger
    backends:
    - NGSPICE_MEASURE
    - NGSPICE_WRDATA
  requires:
    node_roles:
    - SIGNAL_INPUT
  forbids:
