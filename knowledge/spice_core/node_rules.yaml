- rule_id: SPICE_NODE_ZERO_IS_REFERENCE
  schema_version: '1.0'
  knowledge_version: knowledge_book_v1
  category: nodes
  title: Node zero is the reference node
  description: Ground is represented by node 0 and is treated as the universal reference in the generated plans.
  applies_to:
    analyses:
    - OP
    - DC
    - AC
    - TRAN
    metrics: []
    circuit_families: []
    backends: []
  requires:
    node_roles:
    - GROUND
  forbids:
  - ALTERNATE_GROUND_ALIAS_AS_PRIMARY_REFERENCE
  source:
    source_type: CODE_AND_TESTS
    document_path: spec2testbench/domain/entities/testbench.py
    section: null
