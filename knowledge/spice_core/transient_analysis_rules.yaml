- rule_id: TRAN_PROPAGATION_DELAY_REQUIRES_INPUT_AND_OUTPUT
  schema_version: '1.0'
  knowledge_version: knowledge_book_v1
  category: transient_analysis
  title: Propagation delay requires input and output waveforms
  description: Delay extraction needs both input and output threshold crossings and must not be synthesized from output-only data.
  applies_to:
    analyses:
    - TRAN
    metrics:
    - propagation_delay
    - propagation_delay_s
    circuit_families:
    - comparator
    - inverter
    backends:
    - NGSPICE_MEASURE
    - NGSPICE_WRDATA
  requires:
    node_roles:
    - SIGNAL_INPUT
    - OUTPUT
    evidence:
    - INPUT_WAVEFORM
    - OUTPUT_WAVEFORM
  forbids:
  - PROPAGATION_DELAY_FROM_OUTPUT_ONLY
  source:
    source_type: SPEC2TESTBENCH_LOCAL_EVIDENCE
    document_path: spec2testbench/infrastructure/simulator/pyspice_simulator.py
