- rule_id: NGSPICE_WRDATA_AC_EXPORTS_COMPLEX_COMPONENTS
  schema_version: '1.0'
  knowledge_version: knowledge_book_v1
  category: wrdata
  title: AC WRDATA exports real and imaginary components explicitly
  description: Spec2Testbench exports AC complex vectors as explicit real and imaginary columns for both Vin and Vout.
  applies_to:
    analyses:
    - AC
    metrics:
    - dc_gain_db
    - cutoff_frequency_hz
    - bandwidth
    circuit_families:
    - amplifier
    - filter
    - opamp
    backends:
    - NGSPICE_WRDATA
  requires:
    evidence:
    - VIN_COMPLEX_VECTOR
    - VOUT_COMPLEX_VECTOR
  forbids:
  - AC_WRDATA_WITH_MAGNITUDE_ONLY_FOR_TRANSFER_GAIN
