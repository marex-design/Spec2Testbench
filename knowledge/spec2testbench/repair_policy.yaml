schema_version: '1.0'
knowledge_version: knowledge_book_v1
kind: repair_policy
max_repairs: 2
repairable_failure_modes:
- INVALID_NODE_SELECTION
- INVALID_SOURCE_SELECTION
- INVALID_ANALYSIS_PARAMETER
- WINDOW_TOO_SHORT
- UNSUPPORTED_RECIPE_SELECTION
