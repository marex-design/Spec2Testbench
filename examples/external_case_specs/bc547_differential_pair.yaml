schema_version: '2.0'
case_id: external-bc547-differential-pair
name: external_bc547_differential_pair
circuit_type: differential_amplifier
technology: BC547A SPICE model
description: 'External pedagogical case based on a matched BC547A BJT differential
  pair. The case is not part of ACP-28 and is used to demonstrate the SPICE verification
  workflow on a transistor-level differential circuit.

  '
provenance:
  benchmark: external_case
  benchmark_subset: none
  dut:
    path: benchmark/external_cases/bc547_differential_pair.ckt
    topology_and_values_preserved: true
ports:
  input:
  - b1
  - b2
  output:
  - V01
  - V02
  differential_positive:
  - b1
  differential_negative:
  - b2
  common_mode: []
  supply_positive:
  - VCC
  supply_negative:
  - VEE
  bias: []
  reference: []
  loop_break: []
  loop_injection: []
  current_probe: []
operating_conditions:
  nominal_temperature: 27.0
  nominal_supply: 12.0
  process_corner: nominal
stimuli:
- id: vcc_supply
  kind: DC
  source: VCC
  node_positive: VCC
  node_negative: '0'
  parameters:
    dc_value: 12.0
  purpose: Positive 12 V supply.
- id: vee_supply
  kind: DC
  source: VEE
  node_positive: VEE
  node_negative: '0'
  parameters:
    dc_value: -12.0
  purpose: Negative 12 V supply.
- id: differential_ac_input
  kind: AC
  source: Vin1
  node_positive: Vin1
  node_negative: '0'
  parameters:
    magnitude: 0.005
    phase: 0
    dc_value: 0.0
  purpose: Positive half of the symmetric differential excitation.
- id: differential_ac_input_negative
  kind: AC
  source: Vin2
  node_positive: Vin2
  node_negative: '0'
  parameters:
    magnitude: 0.005
    phase: 180
    dc_value: 0.0
  purpose: Negative half of the symmetric differential excitation.
analyses:
- id: op_bias
  type: OP
  parameters: {}
  purpose: Verify the nominal operating point and branch symmetry.
- id: ac_differential
  type: AC
  parameters:
    sweep_type: dec
    points_per_decade: 100
    start_freq: 1.0
    stop_freq: 5.0e8
    reference_frequency_hz: 1000.0
  purpose: Measure the differential small-signal response.
functional_requirements:
- id: BJT_DIFF_GAIN_1K
  description: 'Single-ended differential voltage gain at 1 kHz.

    '
  metric: differential_gain_db
  analysis: ac_differential
  operator: '>='
  threshold: 35.0
  minimum: null
  maximum: null
  unit: dB
  mandatory: true
  criterion_source: external_case_definition
  equivalence: exact
  implementation_status: executable
  executable_metric: differential_gain_db
performance_targets:
  differential_gain_db:
    unit: dB
    diagnostic_only: false
    requirement_ids:
    - BJT_DIFF_GAIN_1K
    min: 35.0
measurement:
  backend: AUTO
  allow_fallback: true
verification:
  auto_select: true
  include_tests: []
  exclude_tests: []
  required_policy: all
  immutable_dut: true
  not_evaluated_on_missing_mandatory_metric: true
  require_full_contract_for_compliance: true
test_categories:
- differential
- ac
