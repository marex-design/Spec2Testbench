name: "two_stage_opamp"
circuit_type: "amplifier"
technology: "CMOS_45nm"

performance_targets:
  dc_gain_db:
    min: 60
    unit: "dB"
  unity_gain_bandwidth_mhz:
    min: 100
    unit: "MHz"
  phase_margin_deg:
    min: 45
    unit: "deg"
  slew_rate_v_us:
    min: 50
    unit: "V/us"
  power_mw:
    max: 10
    unit: "mW"

input_conditions:
  vdd: 1.8
  vss: 0.0
  vcm: 0.9
  cl: 1e-12

test_categories:
  - "dc"
  - "ac"
  - "transient"
