name: analogcoder_pro_p19_mixer
circuit_type: mixer
technology: AnalogCoder-Pro/PySpice generic Level-1 models
description: A Gilbert cell mixer to make Voutp - Voutn ∝ (Vrfp - Vrfn) × (Vlop - Vlon)
source:
  benchmark: AnalogCoder-Pro
  task_id: 19
  level: Hard
  type: Mixer
  submodule_name: Unknown
  netlist: benchmark_analogcoder_pro_28/p19_mixer.cir
performance_targets:
  thd_percent:
    max: 100.0
    unit: '%'
  fundamental_frequency:
    min: 1.0
    unit: Hz
input_conditions:
  vdd: 5.0
  vss: 0.0
  vcm: 2.5
  input_nodes: Vrfp, Vrfn, Vlop, Vlon
  output_nodes: Voutp, Voutn
  testbench_note: 'The testbench provides two sets of differential input signals to the Gilbert Cell mixer: 1.2kHz LO signals (Vlop-Vlon) and 1kHz RF signals (Vrfp-Vrfn).'
  expected_behavior: 'The Voutp and Voutn differential outputs should produce an FFT spectrum showing two primary mixing products: a 200Hz component representing down-conversion (|LO-RF|) and a 2.2kHz component representing up-conversion (LO+RF).'
test_categories:
  - transient
  - spectral
