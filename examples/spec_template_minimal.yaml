# Spec2Testbench minimal YAML template
#
# How to use:
# 1. Copy this file.
# 2. Rename it for your circuit, for example: my_opamp.yaml
# 3. Update the circuit name, circuit_type, node names, and metrics.
# 4. Run:
#    spec2testbench verify --specs path/to/my_opamp.yaml --netlist path/to/my_opamp.cir --no-llm

name: my_circuit
circuit_type: amplifier
technology: generic_spice
description: Short description of the circuit under test.

performance_targets:
  operating_point:
    min: 0.5
    max: 1.3
    unit: V

  quiescent_current:
    max: 0.01
    unit: A

input_conditions:
  vdd: 1.8
  vss: 0.0
  vcm: 0.9
  input_frequency: 1000
  input_nodes:
    - in
  output_nodes:
    - out
  testbench_note: Optional note for the intended excitation.
  expected_behavior: Optional short description of the expected output behavior.

test_categories:
  - dc

# Optional PVT section.
# Keep it only if you want PVT-aware verification.
pvt_config:
  corners:
    - tt
  temperature_range: commercial
  supply_variation: 0.05

# Common circuit_type values already used in this repository include:
# amplifier
# current_mirror
# comparator
# low_pass_filter
# high_pass_filter
# band_pass_filter
# notch_filter
# operational_amplifier
# oscillator
# ring_oscillator
# integrator
# differentiator
# schmitt_trigger
# mixer
#
# Common metric names already supported in the framework include:
# operating_point
# vout_dc
# quiescent_current
# idd
# power
# dc_gain
# dc_gain_db
# bandwidth
# unity_gain_frequency
# phase_margin
# slew_rate
# settling_time
# propagation_delay
# frequency_hz
# startup_amplitude
# thd_percent
# fundamental_frequency
# pvt_vout_variation
# pvt_dc_gain_variation
# pvt_power_variation
