[pytest]
testpaths = tests
markers =
    unit: deterministic unit tests
    integration: end-to-end integration tests
    ngspice: tests requiring a local ngspice executable
    llm: tests requiring an external LLM provider
    llm_stub: tests using deterministic recorded or stubbed LLM responses
    llm_live: tests using a live external LLM provider
    slow: tests that may take longer than the default unit suite
