name: analogcoder_pro_p01_amplifier_strict
circuit_type: amplifier
technology: AnalogCoder-Pro/PySpice generic Level-1 models
description: Strict verification case for a single-stage common-source amplifier after bias-point search.

performance_targets:
  operating_point:
    min: 2.0
    max: 3.2
    unit: V
    weight: 1.0

  dc_gain_db:
    min: 15.0
    unit: dB
    weight: 1.0

  quiescent_current:
    min: 0.0001
    max: 0.0005
    unit: A
    weight: 1.0

input_conditions:
  vdd: 5.0
  vss: 0.0
  vcm: 0.8
  input_nodes: Vin
  output_nodes: Vout

test_categories:
  - dc
  - ac
