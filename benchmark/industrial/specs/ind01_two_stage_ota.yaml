name: ind01_two_stage_ota
circuit_type: opamp
technology: SKY130 open-source PDK
description: Two-stage Miller-compensated OTA benchmark for nominal gain, bandwidth, phase margin, and current checks.
source:
  benchmark: industrial_sky130
  pdk: sky130
  netlist: benchmark/industrial/netlists/ind01_two_stage_ota.cir
performance_targets:
  dc_gain_db:
    min: 20.0
    unit: dB
  bandwidth:
    min: 1000.0
    unit: Hz
  phase_margin:
    min: 30.0
    unit: deg
  quiescent_current:
    max: 0.01
    unit: A
input_conditions:
  vdd: 1.8
  vss: 0.0
  vcm: 0.9
  input_frequency: 100000.0
  input_nodes: inp, inn, vbiasn, vbiasp
  output_nodes: out
  testbench_note: Differential OTA benchmark under nominal 1.8 V operation.
  expected_behavior: Output should exhibit stable small-signal gain and a valid phase-margin estimate.
test_categories:
  - dc
  - ac
  - transient
pvt_config:
  corners:
    - tt
  temperature_range: commercial
  supply_variation: 0.05
