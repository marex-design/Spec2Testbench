name: ind06_strongarm_comparator
circuit_type: comparator
technology: SKY130 open-source PDK
description: Dynamic strongarm-style comparator benchmark for transient decision timing.
source:
  benchmark: industrial_sky130
  pdk: sky130
  netlist: benchmark/industrial/netlists/ind06_strongarm_comparator.cir
performance_targets:
  propagation_delay:
    max: 1.0e-6
    unit: s
input_conditions:
  vdd: 1.8
  vss: 0.0
  vcm: 0.9
  input_frequency: 50000000.0
  input_nodes: inp, inn, clk
  output_nodes: outp, outn
  testbench_note: Dynamic comparator stimulated by a clocked differential input.
  expected_behavior: Regenerative outputs should separate rapidly after the clock edge.
test_categories:
  - transient
pvt_config:
  corners:
    - tt
  temperature_range: commercial
  supply_variation: 0.05
