schema_version: '2.0'
case_id: acp28-p22
name: analogcoder_pro_p22_oscillator
circuit_type: oscillator
technology: AnalogCoder-Pro generic Level-1 benchmark models
description: An RC phase-shift oscillator
provenance:
  benchmark: AnalogCoder-Pro
  benchmark_subset: ACP-28
  upstream_repository: https://github.com/laiyao1/AnalogCoderPro
  upstream_task_id: 22
  upstream_level: Hard
  upstream_type: Oscillator
  upstream_task_description: An RC phase-shift oscillator
  upstream_testbench_description: The testbench initializes the op-amp non-inverting
    input (Vinp) to 2.51V and the inverting input (Vinn) to 2.5V.
  official_checker:
    path: problem_check/Oscillator.py
    criterion_summary:
    - More than two peaks must be detected in the latter half of the waveform.
    - Peak-to-peak oscillator output must exceed 5 uV.
    - Coefficient of variation of detected periods must be below 0.2.
    upstream_mutates_dut: false
    notes: Criterion semantics reconstructed from the local pinned AnalogCoder-Pro
      checker shipped with the uploaded base. The upstream startup protocol seeds
      the first two op-amp pins at 2.51 V and 2.5 V; for this DUT those nodes are
      Vref and Vinn. Spec2Testbench reproduces that .IC test condition without modifying
      DUT topology or component values.
  dut:
    path: benchmark/analogcoder_pro/p22_oscillator.cir
    sha256: 060c0dc5b6e4b187e05faa579f430ea19b0ad2ce490288d324c174fc2df573cb
    canonicalization: Uploaded ACP-28 DUT bytes preserved; embedded analyses/output
      directives are externalized at execution.
    topology_and_values_preserved: true
ports:
  input: &id001 []
  output: &id002
  - Vout
  differential_positive: []
  differential_negative: []
  common_mode: []
  supply_positive:
  - Vdd
  supply_negative:
  - '0'
  bias: []
  reference: []
  loop_break: []
  loop_injection: []
  current_probe: []
operating_conditions:
  nominal_temperature: 25.0
  nominal_supply: 5.0
  process_corner: tt
stimuli: []
