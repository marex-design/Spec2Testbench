  parameters:
    step_time: 1.0e-06
    end_time: 0.02
    start_time: 0.0
    initial_conditions:
      Vref: 2.51
      Vinn: 2.5
  purpose: Oscillator startup and sustained oscillation using the upstream ACP initial-condition
    seed.
