schema_version: '2.0'
case_id: acp28-p24
name: analogcoder_pro_p24_integrator
circuit_type: opamp_integrator
technology: AnalogCoder-Pro generic Level-1 benchmark models
description: An Opamp integrator with resistor R1 and capacitor Cf
provenance:
  benchmark: AnalogCoder-Pro
  benchmark_subset: ACP-28
  upstream_repository: https://github.com/laiyao1/AnalogCoderPro
  upstream_task_id: 24
  upstream_level: Hard
  upstream_type: Integrator
  upstream_task_description: An Opamp integrator with resistor R1 and capacitor Cf
  upstream_testbench_description: The testbench inputs a square wave to Vin.
  official_checker:
    path: problem_check/Integrator.py
    criterion_summary:
    - Integrator ramp slope must match 0.5/(10k*3u) within 30%.
    - The fitted integration ramp must have R^2 >= 0.9.
    upstream_mutates_dut: true
