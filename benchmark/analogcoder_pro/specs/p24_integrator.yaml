      Under the immutable-DUT protocol, the uploaded p24 already has R1=10 kOhm and
      Cf=100 nF, so the expected slope is adapted to 500 V/s while retaining the checker's
      ±30% tolerance.
  dut:
    path: benchmark/analogcoder_pro/p24_integrator.cir
    sha256: 607bd54b1c7b7151c31838ba762ee0a31cab7af9f7486d4fc74785cf1f5fa132
    canonicalization: Uploaded ACP-28 DUT bytes preserved; embedded analyses/output
      directives are externalized at execution.
    topology_and_values_preserved: true
