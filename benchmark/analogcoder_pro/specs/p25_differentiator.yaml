schema_version: '2.0'
case_id: acp28-p25
name: analogcoder_pro_p25_differentiator
circuit_type: opamp_differentiator
technology: AnalogCoder-Pro generic Level-1 benchmark models
description: An Opamp differentiator with resistor Rf and capacitor C1
provenance:
  benchmark: AnalogCoder-Pro
  benchmark_subset: ACP-28
  upstream_repository: https://github.com/laiyao1/AnalogCoderPro
  upstream_task_id: 25
  upstream_level: Hard
  upstream_type: Differentiator
  upstream_task_description: An Opamp differentiator with resistor Rf and capacitor
    C1
  upstream_testbench_description: The testbench inputs a triangle wave to Vin.
  official_checker:
    path: problem_check/Differentiator.py
    criterion_summary:
    - Differentiator output level magnitude around the 2.5 V bias must be 0.6 V within
      20%.
    - Differentiator output must exhibit the square-wave shape test used by the checker.
    upstream_mutates_dut: true
    notes: The upstream checker mutates Rf to 10 kOhm and C1 to 3 uF. Under the immutable-DUT
      protocol, the uploaded p25 already has Rf=10 kOhm and C1=10 nF, so the expected
      differentiator magnitude is adapted to 2 mV while retaining the checker's ±20%
      tolerance. The square-wave-shape criterion remains explicitly NOT_IMPLEMENTED
      and therefore cannot be silently promoted to PASS.
  dut:
    path: benchmark/analogcoder_pro/p25_differentiator.cir
    sha256: a61f56123119e1dfe52afca3d2c2118c101b08d97ef67ddc6de58ecb57063766
    canonicalization: Uploaded ACP-28 DUT bytes preserved; embedded analyses/output
      directives are externalized at execution.
    topology_and_values_preserved: true
ports:
  input: &id001
  - Vin
  output: &id002
  - Vout
  differential_positive: []
  differential_negative: []
  common_mode: []
  supply_positive:
  - Vdd
  supply_negative:
  - '0'
  bias: []
  reference: []
  loop_break: []
  loop_injection: []
  current_probe: []
operating_conditions:
  nominal_temperature: 25.0
  nominal_supply: 5.0
  process_corner: tt
stimuli:
- id: triangle_input
  kind: PULSE
  source: Vin
  node_positive: Vin
  node_negative: '0'
  parameters:
    v1: 2.0
    v2: 3.0
    delay: 0.0
    rise: 0.05
    fall: 0.05
    width: 1.0e-09
    period: 0.1
    dc_value: 2.5
  purpose: Official differentiator checker triangular-wave construction.
analyses:
- id: tran_diff
  type: TRAN
  parameters:
    step_time: 1.0e-06
    end_time: 0.2
    start_time: 0.0
  purpose: Triangle-wave input and square-like differentiator output.
functional_requirements:
- id: ACP_DIFF_AMPLITUDE
  description: Immutable-DUT differentiator output magnitude around the 2.5 V bias
    must match 2 mV within 20%.
  metric: differentiator_output_amplitude_v
  analysis: tran_diff
  operator: between
  threshold: null
  minimum: 0.0016
  maximum: 0.0024
  unit: V
  mandatory: true
  criterion_source: adapted_from_official_checker
  equivalence: adapted
  implementation_status: executable
  executable_metric: differentiator_output_amplitude_v
  notes: Upstream checker rewrites C1 to 3 uF. Spec2Testbench preserves C1=10 nF;
    with Rf=10 kOhm and |dVin/dt|=20 V/s, the expected magnitude is 2 mV. The upstream
    ±20% tolerance is retained.
- id: ACP_DIFF_SHAPE
  description: Differentiator output must exhibit the square-wave shape test used
    by the checker.
  metric: differentiator_square_wave_score
  analysis: tran_diff
  operator: '>='
  threshold: 0.9
  minimum: null
  maximum: null
  unit: ''
  mandatory: true
  criterion_source: official_checker
  equivalence: adapted
  implementation_status: metadata_only
  executable_metric: null
  notes: ''
performance_targets:
  operating_point:
    min: 0.0
    max: 5.0
    unit: V
    diagnostic_only: true
    requirement_ids: []
  differentiator_output_amplitude_v:
    unit: V
    diagnostic_only: false
    requirement_ids:
    - ACP_DIFF_AMPLITUDE
    min: 0.0016
    max: 0.0024
input_conditions:
  vdd: 5.0
  vss: 0.0
  vcm: 2.5
  input_nodes: *id001
  output_nodes: *id002
  temperature: 25.0
  original_source_dc_values:
    vdd: 5.0
    vbias: 1.5
    vref: 2.5
    vin: 3.0
measurement:
  backend: AUTO
  allow_fallback: true
verification:
  auto_select: true
  include_tests: []
  exclude_tests: []
  required_policy: all
  immutable_dut: true
  not_evaluated_on_missing_mandatory_metric: true
  require_full_contract_for_compliance: true
test_requirements:
  dc_sweep_step_v: 0.01
test_categories:
- tran
pvt_config:
  corners:
  - tt
  temperature_range: commercial
  supply_variation: 0.0
